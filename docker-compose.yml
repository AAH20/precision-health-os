services:
  app:
    build:
      context: .
      target: base
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://phos:phos@postgres:5432/precision_health
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    command: phos serve --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phos
      POSTGRES_PASSWORD: phos
      POSTGRES_DB: precision_health
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: base
    environment:
      - DATABASE_URL=postgresql://phos:phos@postgres:5432/precision_health
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: phos worker

volumes:
  postgres_data:
  redis_data:
