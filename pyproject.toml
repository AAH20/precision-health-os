[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "precision-health-os"
version = "0.1.0"
description = "Unified precision health platform: genomics, clinical decision support, medical imaging, wearables, drug discovery, and health IoT"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Ahmed Hassan", email = "aah@a2zsoc.com" },
]
keywords = ["precision-medicine", "genomics", "clinical-decision-support", "medical-imaging", "wearables", "drug-discovery", "health-iot", "fhir", "hl7"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.26.0,<3",
    "pandas>=2.1.0,<3",
    "scipy>=1.11.0,<2",
    "scikit-learn>=1.3.0,<2",
    "pydantic>=2.5.0,<3",
    "typer>=0.9.0,<1",
    "rich>=13.7.0,<14",
    "structlog>=23.2.0,<25",
    "httpx>=0.27.0,<1",
    "redis>=5.0.0,<6",
    "sqlalchemy>=2.0.0,<3",
    "alembic>=1.13.0,<2",
    "cryptography>=41.0.0,<43",
    "python-jose[cryptography]>=3.3.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "python-multipart>=0.0.6,<1",
    "orjson>=3.9.0,<4",
    "networkx>=3.2.0,<4",
    "matplotlib>=3.8.0,<4",
    "seaborn>=0.13.0,<1",
    "plotly>=5.18.0,<6",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1.0,<3",
    "torchvision>=0.16.0,<1",
    "transformers>=4.36.0,<5",
    "datasets>=2.16.0,<4",
    "accelerate>=0.25.0,<1",
]
imaging = [
    "monai>=1.3.0,<2",
    "nibabel>=5.2.0,<6",
    "pydicom>=2.4.0,<4",
    "opencv-python-headless>=4.8.0,<5",
    "pillow>=10.1.0,<12",
]
genomics = [
    "pysam>=0.22.0,<1",
    "biopython>=1.81,<2",
    "cyvcf2>=0.30.0,<1",
]
fhir = [
    "fhir.resources>=7.1.0,<8",
    "fhirclient>=4.1.0,<5",
]
dev = [
    "pytest>=7.4.0,<9",
    "pytest-cov>=4.1.0,<6",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-xdist>=3.5.0,<4",
    "ruff>=0.1.0,<1",
    "bandit>=1.7.0,<2",
    "mypy>=1.7.0,<2",
    "pre-commit>=3.6.0,<4",
    "hypothesis>=6.90.0,<7",
]
all = [
    "precision-health-os[ml,imaging,genomics,fhir,dev]",
]

[project.scripts]
phos = "precision_health_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/precision_health_os"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "Q",    # flake8-quotes
    "FLY",  # flynt
    "PERF", # perflint
    "RUF",  # ruff-specific
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test files: docstrings on every test method add noise without signal, and
# dict()/generator style preferences do not affect test correctness.
"tests/*" = ["D102", "D103", "D104", "D101", "D205", "C408", "C401"]

[tool.ruff.lint.isort]
known-first-party = ["precision_health_os"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "security: marks tests as security tests",
    "np_hard: marks tests for NP-hard problem solvers",
]

[tool.bandit]
exclude_dirs = ["tests"]
# B101: assert used for internal invariants outside tests.
# B104: the CLI binds 0.0.0.0 by default; the app is containerised and the
#       listen address is operator-controlled via --host.
# B311: benchmarks.py uses seeded `random` to generate reproducible solver
#       instances for measurement. It is not a security context; all
#       security-sensitive randomness uses os.urandom / secrets.
skips = ["B101", "B104", "B311"]

[tool.coverage.run]
source = ["src/precision_health_os"]
branch = true

[tool.coverage.report]
show_missing = true
# Ratchet: the suite currently sits at 99%. Keep the gate just below so a
# genuine regression fails CI while normal churn does not.
fail_under = 95
